<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Night background -->
    <radialGradient id="rainBg" cx="40%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="60%" stop-color="#0E111C"/>
      <stop offset="100%" stop-color="#06070B"/>
    </radialGradient>
    <!-- Soft warm bokeh -->
    <radialGradient id="warmBokeh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4D399" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#D97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolBokeh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8096C7" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#4F46E5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>
    <!-- Glass drop filter -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#rainBg)"/>

  <!-- Distant streetlamp and car headlights bokeh in the background -->
  <circle cx="280" cy="340" r="140" fill="url(#warmBokeh1)"/>
  <circle cx="520" cy="480" r="110" fill="url(#coolBokeh1)"/>
  <circle cx="860" cy="260" r="180" fill="url(#warmBokeh1)"/>
  <circle cx="980" cy="520" r="130" fill="url(#coolBokeh1)"/>
  <circle cx="160" cy="620" r="90" fill="url(#warmBokeh1)"/>
  <circle cx="700" cy="380" r="160" fill="url(#coolBokeh1)"/>

  <!-- Horizontal street blur reflection -->
  <ellipse cx="600" cy="650" rx="500" ry="40" fill="#F4D399" opacity="0.04" filter="url(#blur)"/>
  <ellipse cx="780" cy="670" rx="300" ry="30" fill="#8096C7" opacity="0.05" filter="url(#blur)"/>

  <!-- Rain droplets and downward streaks running down the window glass -->
  <g stroke="#E7E6DF" stroke-linecap="round" opacity="0.65">
    <!-- Streaks -->
    <path d="M120,40 Q125,180 122,340" fill="none" stroke-width="1.8"/>
    <circle cx="122" cy="342" r="3.5" fill="#E7E6DF"/>

    <path d="M240,110 Q238,260 242,420" fill="none" stroke-width="1.2"/>
    <circle cx="242" cy="421" r="2.8" fill="#E7E6DF"/>

    <path d="M380,20 Q384,190 380,390" fill="none" stroke-width="2.2"/>
    <circle cx="380" cy="393" r="4.2" fill="#E7E6DF"/>

    <path d="M490,90 Q488,280 492,530" fill="none" stroke-width="1.5"/>
    <circle cx="492" cy="532" r="3.2" fill="#E7E6DF"/>

    <path d="M640,40 Q645,210 640,470" fill="none" stroke-width="2.4"/>
    <circle cx="640" cy="473" r="4.5" fill="#E7E6DF"/>

    <path d="M780,140 Q776,310 782,560" fill="none" stroke-width="1.6"/>
    <circle cx="782" cy="562" r="3.4" fill="#E7E6DF"/>

    <path d="M910,30 Q915,220 910,410" fill="none" stroke-width="2.0"/>
    <circle cx="910" cy="413" r="3.8" fill="#E7E6DF"/>

    <path d="M1040,120 Q1036,330 1042,610" fill="none" stroke-width="1.4"/>
    <circle cx="1042" cy="612" r="3.0" fill="#E7E6DF"/>

    <!-- Small scattered droplets -->
    <circle cx="180" cy="210" r="2" fill="#E7E6DF" opacity="0.8"/>
    <circle cx="210" cy="290" r="1.5" fill="#E7E6DF" opacity="0.7"/>
    <circle cx="310" cy="160" r="2.5" fill="#E7E6DF" opacity="0.9"/>
    <circle cx="340" cy="480" r="1.8" fill="#E7E6DF" opacity="0.6"/>
    <circle cx="420" cy="320" r="2.2" fill="#E7E6DF" opacity="0.8"/>
    <circle cx="560" cy="220" r="1.6" fill="#E7E6DF" opacity="0.7"/>
    <circle cx="590" cy="390" r="2.8" fill="#E7E6DF" opacity="0.9"/>
    <circle cx="710" cy="180" r="2.0" fill="#E7E6DF" opacity="0.8"/>
    <circle cx="740" cy="490" r="1.4" fill="#E7E6DF" opacity="0.5"/>
    <circle cx="830" cy="360" r="2.6" fill="#E7E6DF" opacity="0.8"/>
    <circle cx="870" cy="150" r="1.7" fill="#E7E6DF" opacity="0.7"/>
    <circle cx="960" cy="280" r="2.3" fill="#E7E6DF" opacity="0.85"/>
    <circle cx="990" cy="440" r="1.5" fill="#E7E6DF" opacity="0.6"/>
    <circle cx="1110" cy="220" r="2.1" fill="#E7E6DF" opacity="0.8"/>
    <circle cx="1140" cy="380" r="1.6" fill="#E7E6DF" opacity="0.7"/>
  </g>

  <!-- Window Frame Corner Silhouette -->
  <rect x="0" y="0" width="1200" height="24" fill="#090A0F" opacity="0.7"/>
  <rect x="0" y="776" width="1200" height="24" fill="#090A0F" opacity="0.7"/>
</svg>
