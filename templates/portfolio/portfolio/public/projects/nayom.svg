<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="60%" stop-color="#101525"/>
      <stop offset="100%" stop-color="#181d30"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8096C7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#8096C7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6B638F" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Subtle coordinate grid -->
  <g opacity="0.15" stroke="#8096C7" stroke-width="0.5">
    <line x1="100" y1="0" x2="100" y2="500" stroke-dasharray="4,4"/>
    <line x1="250" y1="0" x2="250" y2="500" stroke-dasharray="4,4"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke-dasharray="4,4"/>
    <line x1="550" y1="0" x2="550" y2="500" stroke-dasharray="4,4"/>
    <line x1="700" y1="0" x2="700" y2="500" stroke-dasharray="4,4"/>
    <line x1="0" y1="125" x2="800" y2="125" stroke-dasharray="4,4"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke-dasharray="4,4"/>
    <line x1="0" y1="375" x2="800" y2="375" stroke-dasharray="4,4"/>
  </g>

  <!-- Network Geometric Topology -->
  <path d="M160,340 Q280,180 400,250 T640,160" fill="none" stroke="url(#lineGrad)" stroke-width="2.5"/>
  <path d="M220,160 Q360,320 500,210 T720,320" fill="none" stroke="#6B638F" stroke-opacity="0.3" stroke-width="1.5"/>
  <path d="M120,220 L280,180 L400,250 L560,320 L680,240" fill="none" stroke="#8096C7" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Network Nodes -->
  <circle cx="280" cy="180" r="5" fill="#8096C7" filter="url(#glow)"/>
  <circle cx="400" cy="250" r="7" fill="#E7E6DF" filter="url(#glow)"/>
  <circle cx="560" cy="320" r="4.5" fill="#6B638F" filter="url(#glow)"/>
  <circle cx="640" cy="160" r="6" fill="#8096C7" filter="url(#glow)"/>
  <circle cx="160" cy="340" r="4" fill="#878993"/>

  <!-- Telemetry Typography -->
  <text x="50" y="60" fill="#8096C7" font-family="monospace" font-size="12" letter-spacing="3">SYS // NAYOM ARCHITECTURE</text>
  <text x="50" y="80" fill="#878993" font-family="monospace" font-size="10" letter-spacing="1">EXPERIMENT 01 · TOPOLOGY MATRIX</text>
  <text x="750" y="60" text-anchor="end" fill="#E7E6DF" font-family="monospace" font-size="11">NODE_COUNT: 256</text>
  <text x="750" y="80" text-anchor="end" fill="#878993" font-family="monospace" font-size="9">STATUS: ONLINE / STABLE</text>

  <!-- Central Title watermark -->
  <text x="400" y="440" text-anchor="middle" fill="#E7E6DF" opacity="0.35" font-family="sans-serif" font-size="28" font-weight="700" letter-spacing="12">NAYOM</text>
</svg>
