<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="yellowGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,230,0,0.08)" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.15)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad1)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#dots)" opacity="0.6"/>

  <!-- Tactical HUD Frame -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="rgba(255,230,0,0.3)" stroke-width="1.5"/>
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#FFE600" stroke-width="3"/>
  <path d="M 1130 30 L 1170 30 L 1170 70" fill="none" stroke="#FFE600" stroke-width="3"/>
  <path d="M 30 730 L 30 770 L 70 770" fill="none" stroke="#FFE600" stroke-width="3"/>
  <path d="M 1130 770 L 1170 770 L 1170 730" fill="none" stroke="#FFE600" stroke-width="3"/>

  <!-- Top Telemetry Header -->
  <text x="60" y="70" font-family="monospace" font-size="14" fill="#FFE600" letter-spacing="3">SYS.NODE // NEURAL-CORE-01 [ACTIVE]</text>
  <text x="1000" y="70" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.6)" letter-spacing="2">LATENCY: 0.08MS</text>
  <line x1="60" y1="85" x2="1140" y2="85" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Central Neural Geometric Core -->
  <g transform="translate(600, 410)">
    <!-- Outer concentric radar rings -->
    <circle r="280" fill="none" stroke="rgba(255,230,0,0.1)" stroke-width="1" stroke-dasharray="8 8"/>
    <circle r="220" fill="none" stroke="rgba(255,230,0,0.2)" stroke-width="1.5"/>
    <circle r="150" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle r="90" fill="none" stroke="#FFE600" stroke-width="2" stroke-dasharray="14 6"/>

    <!-- Crosshairs -->
    <line x1="-300" y1="0" x2="300" y2="0" stroke="rgba(255,230,0,0.15)" stroke-width="1"/>
    <line x1="0" y1="-300" x2="0" y2="300" stroke="rgba(255,230,0,0.15)" stroke-width="1"/>

    <!-- Icosahedral / Neural Node Connections -->
    <polygon points="0,-180 155,-90 155,90 0,180 -155,90 -155,-90" fill="rgba(255,230,0,0.03)" stroke="#FFE600" stroke-width="2"/>
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    
    <!-- Internal cross lines -->
    <line x1="0" y1="-180" x2="0" y2="180" stroke="rgba(255,230,0,0.4)" stroke-width="1"/>
    <line x1="-155" y1="-90" x2="155" y2="90" stroke="rgba(255,230,0,0.4)" stroke-width="1"/>
    <line x1="-155" y1="90" x2="155" y2="-90" stroke="rgba(255,230,0,0.4)" stroke-width="1"/>

    <!-- Node Points -->
    <circle cx="0" cy="-180" r="6" fill="#FFE600"/>
    <circle cx="155" cy="-90" r="6" fill="#FFE600"/>
    <circle cx="155" cy="90" r="6" fill="#FFE600"/>
    <circle cx="0" cy="180" r="6" fill="#FFE600"/>
    <circle cx="-155" cy="90" r="6" fill="#FFE600"/>
    <circle cx="-155" cy="-90" r="6" fill="#FFE600"/>
    <circle cx="0" cy="0" r="12" fill="#FFE600"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#FFE600" stroke-width="2"/>

    <!-- Rotating Indicator Arcs -->
    <path d="M -180 0 A 180 180 0 0 1 0 -180" fill="none" stroke="#FFE600" stroke-width="4"/>
    <path d="M 180 0 A 180 180 0 0 1 0 180" fill="none" stroke="#FFE600" stroke-width="4"/>
  </g>

  <!-- Telemetry Data Blocks Left -->
  <g transform="translate(60, 160)">
    <rect width="180" height="70" fill="rgba(0,0,0,0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)">INFERENCE LATENCY</text>
    <text x="15" y="55" font-family="monospace" font-weight="bold" font-size="22" fill="#FFE600">0.08ms</text>
  </g>
  <g transform="translate(60, 250)">
    <rect width="180" height="70" fill="rgba(0,0,0,0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)">CONCURRENT STREAMS</text>
    <text x="15" y="55" font-family="monospace" font-weight="bold" font-size="22" fill="#FFFFFF">12,480</text>
  </g>
  <g transform="translate(60, 340)">
    <rect width="180" height="70" fill="rgba(0,0,0,0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)">GPU MEMORY USAGE</text>
    <text x="15" y="55" font-family="monospace" font-weight="bold" font-size="22" fill="#FFE600">98.4%</text>
  </g>

  <!-- Waveform & Realtime Telemetry Bottom Right -->
  <g transform="translate(900, 580)">
    <rect width="240" height="130" fill="rgba(0,0,0,0.8)" stroke="rgba(255,230,0,0.4)" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="11" fill="#FFE600">TENSOR STREAM [T-0]</text>
    <polyline points="15,80 35,65 55,90 75,45 95,85 115,35 135,70 155,50 175,95 195,40 215,60 225,55" fill="none" stroke="#FFE600" stroke-width="2"/>
    <text x="15" y="115" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.5)">CLUSTER: GLOBAL-EDGE-18</text>
  </g>

  <!-- Bottom Bar Info -->
  <text x="60" y="740" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="2">[ CORE 01 // KINETIC COMPUTE ARCHITECTURE ]</text>
  <text x="1050" y="740" font-family="monospace" font-size="12" fill="#FFE600" letter-spacing="2">60 FPS // 4K</text>
</svg>
