<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a11"/>
      <stop offset="100%" stop-color="#053322"/>
    </linearGradient>
    <pattern id="gridMint" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,255,136,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradMint)"/>
  <rect width="1200" height="800" fill="url(#gridMint)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="rgba(0,255,136,0.3)" stroke-width="1.5"/>
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#00FF88" stroke-width="3"/>
  <path d="M 1130 30 L 1170 30 L 1170 70" fill="none" stroke="#00FF88" stroke-width="3"/>
  <path d="M 30 730 L 30 770 L 70 770" fill="none" stroke="#00FF88" stroke-width="3"/>
  <path d="M 1130 770 L 1170 770 L 1170 730" fill="none" stroke="#00FF88" stroke-width="3"/>

  <!-- Header -->
  <text x="60" y="70" font-family="monospace" font-size="14" fill="#00FF88" letter-spacing="3">SYS.PROTOCOL // VORTEX-ZK-VAULT [SYNCED]</text>
  <text x="960" y="70" font-family="monospace" font-size="14" fill="#FFE600" letter-spacing="2">$4.2B VOLUME // 0 FAULTS</text>
  <line x1="60" y1="85" x2="1140" y2="85" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>

  <!-- Cryptographic Vortex Center -->
  <g transform="translate(600, 400)">
    <!-- Rotating nested geometric boxes -->
    <rect x="-180" y="-180" width="360" height="360" fill="none" stroke="rgba(0,255,136,0.2)" stroke-width="1.5" transform="rotate(0)"/>
    <rect x="-150" y="-150" width="300" height="300" fill="none" stroke="rgba(0,255,136,0.3)" stroke-width="1.5" transform="rotate(15)"/>
    <rect x="-120" y="-120" width="240" height="240" fill="none" stroke="#00FF88" stroke-width="2" transform="rotate(30)"/>
    <rect x="-90" y="-90" width="180" height="180" fill="none" stroke="#FFE600" stroke-width="2" transform="rotate(45)"/>
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="#FFFFFF" stroke-width="2" transform="rotate(60)"/>
    <rect x="-30" y="-30" width="60" height="60" fill="#00FF88" transform="rotate(75)"/>

    <!-- Concentric circles -->
    <circle r="260" fill="none" stroke="rgba(0,255,136,0.15)" stroke-width="2" stroke-dasharray="6 8"/>
    <circle r="210" fill="none" stroke="rgba(255,230,0,0.2)" stroke-width="1.5"/>

    <!-- Hex data anchors -->
    <text x="210" y="-8" font-family="monospace" font-size="11" fill="#00FF88">0x9F4B</text>
    <text x="-260" y="-8" font-family="monospace" font-size="11" fill="#00FF88">0x3A7C</text>
    <text x="-25" y="235" font-family="monospace" font-size="11" fill="#FFE600">0x88EE</text>
  </g>

  <!-- Left Stats Block -->
  <g transform="translate(80, 200)">
    <rect width="180" height="240" fill="rgba(2,26,17,0.85)" stroke="rgba(0,255,136,0.3)" stroke-width="1"/>
    <text x="20" y="30" font-family="monospace" font-size="11" fill="rgba(0,255,136,0.7)">PROVER PROOF TIME</text>
    <text x="20" y="65" font-family="monospace" font-weight="bold" font-size="24" fill="#00FF88">0.42 sec</text>
    <line x1="20" y1="85" x2="160" y2="85" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>
    <text x="20" y="115" font-family="monospace" font-size="11" fill="rgba(0,255,136,0.7)">TPS THROUGHPUT</text>
    <text x="20" y="150" font-family="monospace" font-weight="bold" font-size="24" fill="#FFFFFF">45,000</text>
    <line x1="20" y1="170" x2="160" y2="170" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>
    <text x="20" y="200" font-family="monospace" font-size="11" fill="rgba(0,255,136,0.7)">VALIDITY STATE</text>
    <text x="20" y="225" font-family="monospace" font-size="13" fill="#FFE600">VERIFIED [ZK-SNARK]</text>
  </g>

  <!-- Right Block Log -->
  <g transform="translate(920, 200)">
    <rect width="200" height="240" fill="rgba(2,26,17,0.85)" stroke="rgba(0,255,136,0.3)" stroke-width="1"/>
    <text x="20" y="30" font-family="monospace" font-size="12" fill="#00FF88">BLOCK TELEMETRY</text>
    <text x="20" y="65" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.7)">BLOCK #19,482,019</text>
    <text x="20" y="90" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.7)">GAS SAVINGS: 84.6%</text>
    <text x="20" y="115" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.7)">NODES SYNCED: 100%</text>
    <text x="20" y="140" font-family="monospace" font-size="10" fill="#FFE600">STATE HASH: 0x9e...a4</text>
    <rect x="20" y="170" width="160" height="40" fill="rgba(0,255,136,0.15)" stroke="#00FF88" stroke-width="1"/>
    <text x="30" y="195" font-family="monospace" font-size="11" fill="#00FF88">CONSENSUS: FINAL</text>
  </g>

  <text x="60" y="740" font-family="monospace" font-size="12" fill="rgba(0,255,136,0.6)" letter-spacing="2">[ CORE 03 // ZERO-KNOWLEDGE CRYPTOGRAPHY ]</text>
  <text x="1000" y="740" font-family="monospace" font-size="12" fill="#00FF88" letter-spacing="2">ZK-V4 READY</text>
</svg>
