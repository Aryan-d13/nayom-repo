<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCarbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#14171d"/>
    </linearGradient>
    <pattern id="gridCarbon" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradCarbon)"/>
  <rect width="1200" height="800" fill="url(#gridCarbon)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#FFE600" stroke-width="3"/>
  <path d="M 1130 30 L 1170 30 L 1170 70" fill="none" stroke="#FFE600" stroke-width="3"/>
  <path d="M 30 730 L 30 770 L 70 770" fill="none" stroke="#FFE600" stroke-width="3"/>
  <path d="M 1130 770 L 1170 770 L 1170 730" fill="none" stroke="#FFE600" stroke-width="3"/>

  <!-- Header -->
  <text x="60" y="70" font-family="monospace" font-size="14" fill="#FFE600" letter-spacing="3">SYS.TERMINAL // MATRIX-MULTIPLEXER-V2</text>
  <text x="960" y="70" font-family="monospace" font-size="14" fill="#FFFFFF" letter-spacing="2">90K ACTIVE SESSIONS // 10MS</text>
  <line x1="60" y1="85" x2="1140" y2="85" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Terminal Window Panes -->
  <!-- Pane 1: Main Terminal CLI -->
  <g transform="translate(60, 110)">
    <rect width="640" height="420" fill="rgba(5,5,8,0.95)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- Window Bar -->
    <rect width="640" height="35" fill="rgba(20,22,28,0.9)"/>
    <circle cx="20" cy="18" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="18" r="5" fill="#27C93F"/>
    <text x="75" y="22" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">kai@matrix-node-01: ~/production/distributed-engine</text>

    <!-- Terminal Text Stream -->
    <text x="25" y="70" font-family="monospace" font-size="13" fill="#FFE600">$ cargo build --release --target x86_64-unknown-linux-musl</text>
    <text x="25" y="95" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.8)">  Compiling kernel-runtime v4.9.0 (/src/core)</text>
    <text x="25" y="115" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.8)">  Compiling webgl-pipeline v2.1.4 (/src/gfx)</text>
    <text x="25" y="135" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.8)">  Compiling edge-telemetry v1.8.0 (/src/telemetry)</text>
    <text x="25" y="165" font-family="monospace" font-weight="bold" font-size="13" fill="#00FF88">    Finished release [optimized] target(s) in 1.48s</text>
    <text x="25" y="200" font-family="monospace" font-size="13" fill="#FFE600">$ ./target/release/server --port 8080 --threads 64</text>
    <text x="25" y="225" font-family="monospace" font-size="12" fill="#FFFFFF">[2024-08-25 12:00:01] INFO  Binding 64 epoll worker threads...</text>
    <text x="25" y="245" font-family="monospace" font-size="12" fill="#FFFFFF">[2024-08-25 12:00:01] INFO  Global cluster connected. Latency: 0.12ms</text>
    <text x="25" y="265" font-family="monospace" font-size="12" fill="#00F0FF">[2024-08-25 12:00:02] TELEM Streaming telemetry to 90,412 subscribers</text>
    <text x="25" y="295" font-family="monospace" font-size="13" fill="#FFE600">$ <tspan fill="#FFE600" font-weight="bold">_</tspan></text>
  </g>

  <!-- Pane 2: Realtime CPU/RAM Telemetry Right -->
  <g transform="translate(730, 110)">
    <rect width="410" height="420" fill="rgba(5,5,8,0.95)" stroke="rgba(255,230,0,0.3)" stroke-width="1"/>
    <rect width="410" height="35" fill="rgba(20,22,28,0.9)"/>
    <text x="20" y="22" font-family="monospace" font-size="12" fill="#FFE600">SYS.TOP // PROCESS MONITOR</text>

    <!-- CPU Bar -->
    <text x="20" y="70" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)">CPU USAGE [64 CORES]</text>
    <rect x="20" y="80" width="370" height="18" fill="rgba(255,255,255,0.1)"/>
    <rect x="20" y="80" width="310" height="18" fill="#FFE600"/>
    <text x="340" y="94" font-family="monospace" font-size="11" fill="#000000" font-weight="bold">84%</text>

    <!-- RAM Bar -->
    <text x="20" y="130" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)">MEMORY [128 GB ECC]</text>
    <rect x="20" y="140" width="370" height="18" fill="rgba(255,255,255,0.1)"/>
    <rect x="20" y="140" width="220" height="18" fill="#00F0FF"/>
    <text x="250" y="154" font-family="monospace" font-size="11" fill="#000000" font-weight="bold">59%</text>

    <!-- Network IO -->
    <text x="20" y="190" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)">NETWORK I/O (100GbE)</text>
    <polyline points="20,260 50,240 80,255 110,210 140,235 170,195 200,225 230,190 260,210 290,175 320,220 350,180 380,205" fill="none" stroke="#00FF88" stroke-width="2"/>
    <text x="20" y="290" font-family="monospace" font-size="12" fill="#00FF88">TX: 48.2 Gbps  |  RX: 32.8 Gbps</text>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(60, 560)">
    <rect width="1080" height="150" fill="rgba(5,5,8,0.9)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="25" y="35" font-family="monospace" font-size="13" fill="#FFE600">ACTIVE MULTIPLEXER PANELS [4/4]</text>
    <line x1="25" y1="50" x2="1055" y2="50" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <text x="25" y="85" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">PANEL 01: RUST_KERNEL</text>
    <text x="25" y="115" font-family="monospace" font-size="11" fill="#00FF88">STATUS: HEALTHY</text>

    <text x="300" y="85" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">PANEL 02: GLSL_SHADERS</text>
    <text x="300" y="115" font-family="monospace" font-size="11" fill="#00F0FF">FRAME: 120 FPS</text>

    <text x="580" y="85" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">PANEL 03: ZK_SEQUENCER</text>
    <text x="580" y="115" font-family="monospace" font-size="11" fill="#FFE600">CONSENSUS: 100%</text>

    <text x="850" y="85" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.6)">PANEL 04: AUTH_VAULT</text>
    <text x="850" y="115" font-family="monospace" font-size="11" fill="#FFFFFF">HARDWARE KEY: LOCKED</text>
  </g>

  <text x="60" y="745" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)" letter-spacing="2">[ CORE 04 // CLOUD DEVELOPER MULTIPLEXER ]</text>
</svg>
