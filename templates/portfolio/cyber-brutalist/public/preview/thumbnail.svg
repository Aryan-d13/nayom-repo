<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="prevBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#prevBg)"/>
  
  <!-- Cyber Yellow Accent Top Line -->
  <rect x="0" y="0" width="1200" height="8" fill="#FFE600"/>

  <!-- Hazard pattern ribbon -->
  <rect x="0" y="8" width="1200" height="24" fill="repeating-linear-gradient(-45deg, #FFE600, #FFE600 15px, #050505 15px, #050505 30px)"/>

  <!-- Grid lines -->
  <line x1="80" y1="0" x2="80" y2="630" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="1120" y1="0" x2="1120" y2="630" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="0" y1="120" x2="1200" y2="120" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Corner targeting brackets -->
  <path d="M 80 160 L 80 130 L 110 130" fill="none" stroke="#FFE600" stroke-width="3"/>
  <path d="M 1090 130 L 1120 130 L 1120 160" fill="none" stroke="#FFE600" stroke-width="3"/>
  <path d="M 80 540 L 80 570 L 110 570" fill="none" stroke="#FFE600" stroke-width="3"/>
  <path d="M 1090 570 L 1120 570 L 1120 540" fill="none" stroke="#FFE600" stroke-width="3"/>

  <!-- Badge -->
  <rect x="120" y="170" width="220" height="36" rx="18" fill="#FFE600"/>
  <text x="145" y="194" font-family="monospace" font-weight="bold" font-size="12" fill="#000000" letter-spacing="2">SYS.TEMPLATE // 01</text>

  <!-- Massive Headline -->
  <text x="120" y="290" font-family="sans-serif" font-weight="900" font-size="82" fill="#FFFFFF" letter-spacing="-2">CYBER INDUSTRIAL</text>
  <text x="120" y="380" font-family="sans-serif" font-weight="900" font-size="82" fill="#FFE600" letter-spacing="-2">BRUTALIST PORTFOLIO</text>

  <!-- Subtitle -->
  <text x="120" y="440" font-family="sans-serif" font-size="20" fill="rgba(255,255,255,0.7)">High-Velocity Systems Architecture &amp; WebGL Kinetic Computing</text>

  <!-- Stats row -->
  <g transform="translate(120, 480)">
    <text x="0" y="30" font-family="monospace" font-weight="bold" font-size="32" fill="#FFE600">0.08ms</text>
    <text x="0" y="55" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)">LATENCY</text>

    <text x="200" y="30" font-family="monospace" font-weight="bold" font-size="32" fill="#FFFFFF">120 FPS</text>
    <text x="200" y="55" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)">CHOREOGRAPHY</text>

    <text x="420" y="30" font-family="monospace" font-weight="bold" font-size="32" fill="#FFE600">100/100</text>
    <text x="420" y="55" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)">LIGHTHOUSE</text>
  </g>

  <!-- Wireframe motif right -->
  <g transform="translate(940, 360)">
    <circle r="140" fill="none" stroke="rgba(255,230,0,0.2)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="90" fill="none" stroke="#FFE600" stroke-width="2"/>
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#FFE600" stroke-width="1.5"/>
    <line x1="-69" y1="-40" x2="69" y2="40" stroke="#FFE600" stroke-width="1.5"/>
    <line x1="-69" y1="40" x2="69" y2="-40" stroke="#FFE600" stroke-width="1.5"/>
  </g>
</svg>
